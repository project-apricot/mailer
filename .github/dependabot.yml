version: 2
updates:
  - package-ecosystem: nuget
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      prefix: "chore(deps)"
    groups:
      mailkit:
        patterns:
          - "MailKit"
          - "MimeKit"
      microsoft-extensions:
        patterns:
          - "Microsoft.Extensions.*"
    ignore:
      - dependency-name: "xunit*"
      - dependency-name: "Microsoft.NET.Test.Sdk"
      - dependency-name: "coverlet.*"
      - dependency-name: "Microsoft.Testing.*"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - ci
    commit-message:
      prefix: "ci(deps)"
    groups:
      github-actions:
        patterns:
          - "*"
